<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Questionnaire fin de stage HGE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: the form is one paper-width column of tick-box questions, numbered as on the original sheet;
   the results are a wide tabbed board, filters in one row above everything they scope. */
:root {
  --bg: #f0f4f4; --surface: #fcfdfd; --surface-2: #f4f8f8;
  --ink: #0f1f20; --ink-2: #41555a; --ink-3: #5f7275;
  --line: #dbe4e4; --line-2: #b6c5c6;
  --accent: #0d6b68; --accent-ink: #ffffff; --accent-soft: #dcefed;
  --danger: #b3261e; --danger-soft: #fbe9e7;
  --c-yes: #2a78d6; --c-yes-t: #ffffff;
  --c-mid: #1baf7a; --c-mid-t: #0b1416;
  --c-no: #eb6834; --c-no-t: #0b1416;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #1c5cab;
  --seq-t-1: #0b1416; --seq-t-2: #0b1416; --seq-t-3: #0b1416; --seq-t-4: #0b1416; --seq-t-5: #ffffff;
  --shadow: 0 1px 2px rgba(15, 31, 32, .06), 0 8px 24px -12px rgba(15, 31, 32, .18);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1314; --surface: #161d1e; --surface-2: #1c2526;
    --ink: #edf3f2; --ink-2: #b3c2c2; --ink-3: #8a9c9d;
    --line: #263132; --line-2: #3d4c4e;
    --accent: #55c2b8; --accent-ink: #06211f; --accent-soft: #17302e;
    --danger: #f2877f; --danger-soft: #3a1c1a;
    --c-yes: #3987e5; --c-yes-t: #0b1416;
    --c-mid: #199e70; --c-mid-t: #0b1416;
    --c-no: #d95926; --c-no-t: #0b1416;
    --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
    --seq-t-1: #ffffff; --seq-t-2: #ffffff; --seq-t-3: #ffffff; --seq-t-4: #0b1416; --seq-t-5: #0b1416;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1314; --surface: #161d1e; --surface-2: #1c2526;
  --ink: #edf3f2; --ink-2: #b3c2c2; --ink-3: #8a9c9d;
  --line: #263132; --line-2: #3d4c4e;
  --accent: #55c2b8; --accent-ink: #06211f; --accent-soft: #17302e;
  --danger: #f2877f; --danger-soft: #3a1c1a;
  --c-yes: #3987e5; --c-yes-t: #0b1416;
  --c-mid: #199e70; --c-mid-t: #0b1416;
  --c-no: #d95926; --c-no-t: #0b1416;
  --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
  --seq-t-1: #ffffff; --seq-t-2: #ffffff; --seq-t-3: #ffffff; --seq-t-4: #0b1416; --seq-t-5: #0b1416;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 15px; min-width: 0; }
.brand-mark { width: 22px; height: 22px; border: 2px solid var(--accent); border-radius: 5px; display: grid; place-items: center; flex: none; }
.brand-mark::after { content: ""; width: 10px; height: 5px; border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: translateY(-1.5px) rotate(-45deg); }
.brand small { font-family: var(--font-body); font-weight: 400; color: var(--ink-3); font-size: 13px; }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }

/* ---------- form ---------- */
.sheet { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 20px; }
.intro { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.intro h1 { font-size: clamp(30px, 6.5vw, 44px); letter-spacing: -.02em; }
.lead { color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.anon { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 15px; }
.anon b { font-family: var(--font-display); }
.anon-ico { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent); position: relative; margin-top: 1px; }
.anon-ico::before { content: ""; position: absolute; left: -3px; right: -3px; top: 8px; height: 2px; background: var(--accent); transform: rotate(-38deg); }
.notice { border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; font-size: 15px; color: var(--ink-2); background: var(--surface); }
.notice.err { border-color: var(--danger); background: var(--danger-soft); color: var(--ink); }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.sec-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
.sec-head h2 { font-size: 22px; letter-spacing: -.01em; }
.sec-head span { margin-left: auto; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec-body { display: flex; flex-direction: column; }
.q { border: 0; margin: 0; padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.q + .q { border-top: 1px solid var(--line); }
.q.sub { padding-top: 0; border-top: 0; margin-top: -4px; }
.q-label { padding: 0; font-weight: 700; font-size: 16.5px; line-height: 1.35; display: block; }
.q-label .num { display: inline-block; min-width: 1.9em; color: var(--accent); font-family: var(--font-display); }
.q-label .req { color: var(--danger); margin-left: 4px; }
.q-hint { font-size: 14px; color: var(--ink-3); margin-top: -6px; }
.q-err { font-size: 14px; color: var(--danger); font-weight: 700; }
.q.invalid { box-shadow: inset 3px 0 0 var(--danger); }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; display: inline-flex; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 8px 14px 8px 11px; border: 1.5px solid var(--line-2); border-radius: 8px; background: var(--surface); font-size: 15.5px; line-height: 1.2; user-select: none; }
.opt span::before { content: ""; flex: none; width: 17px; height: 17px; border: 1.5px solid var(--ink-3); border-radius: 4px; background: var(--surface); }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opt input:checked + span::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:hover span { border-color: var(--accent); }
.opt.num span { padding: 8px 0; min-width: 44px; justify-content: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.opt.num span::before { display: none; }
.opt.num input:checked + span { background: var(--accent); color: var(--accent-ink); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.scale .opt, .scale .opt span { width: 100%; }
.scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); margin-top: -4px; }
@media (max-width: 520px) { .scale { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px 16px; padding: 10px 0; flex-wrap: wrap; }
.row + .row { border-top: 1px dashed var(--line); }
.row-label { flex: 1 1 220px; min-width: 0; font-size: 15.5px; }
.row .seg { flex: none; }
.row .opt span { min-height: 38px; }
@media (max-width: 520px) { .row .seg { width: 100%; } .row.sat .opt { flex: 1 1 100%; } .row.sat .opt span { width: 100%; } }

.field { width: 100%; border: 1.5px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 10px 12px; min-height: 44px; resize: vertical; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field-label { font-size: 15px; font-weight: 700; color: var(--ink-2); }

.actions { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.btn { appearance: none; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 9px 16px; min-height: 42px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 17px; padding: 12px 24px; min-height: 50px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: inherit; }
.foot { font-size: 13.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
.foot a { color: var(--ink-3); }

.thanks { text-align: left; padding: 36px 24px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.thanks h1 { font-size: clamp(30px, 6.5vw, 44px); letter-spacing: -.02em; }
.thanks .big-check { width: 54px; height: 54px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; }
.thanks .big-check::after { content: ""; width: 24px; height: 12px; border-left: 4px solid var(--accent-ink); border-bottom: 4px solid var(--accent-ink); transform: translateY(-3px) rotate(-45deg); }

/* ---------- results ---------- */
.board { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 18px; }
.board-head { display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.board-head h1 { font-size: clamp(26px, 4.5vw, 34px); letter-spacing: -.02em; }
.board-head p { color: var(--ink-2); font-size: 15px; }
.board-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.banner { border: 1.5px dashed var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 15px; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.banner b { font-family: var(--font-display); }
.filters { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: flex-end; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; min-width: 0; }
.filters select, .ctl { border: 1.5px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 7px 10px; min-height: 38px; font-size: 15px; max-width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
.filters .count { margin-left: auto; font-size: 14px; color: var(--ink-2); align-self: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs button { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 700; font-size: 15px; color: var(--ink-2); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { container-type: inline-size; grid-column: span 12; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.half { grid-column: span 6; }
.card.third { grid-column: span 4; }
.card.two-third { grid-column: span 8; }
@media (max-width: 860px) { .card.half, .card.third, .card.two-third { grid-column: span 12; } }
.card-head { display: flex; flex-direction: column; gap: 2px; }
.card h3 { font-size: 17px; letter-spacing: -.005em; }
.card .sub { font-size: 13.5px; color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 15px; padding: 18px 0; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k-label { font-size: 13.5px; color: var(--ink-2); }
.kpi .k-val { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.kpi .k-val small { font-size: 15px; font-weight: 400; color: var(--ink-3); margin-left: 3px; }
.kpi .k-sub { font-size: 13px; color: var(--ink-3); }
.kpi.hero { background: var(--accent-soft); border-color: transparent; }
.kpi.hero .k-val { font-size: 48px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.sw-yes { background: var(--c-yes); } .sw-mid { background: var(--c-mid); } .sw-no { background: var(--c-no); }

.srows { display: flex; flex-direction: column; gap: 10px; }
.srow { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr) minmax(76px, auto); gap: 4px 14px; align-items: center; }
.srow-label { font-size: 14.5px; min-width: 0; }
.srow-meta { font-size: 13px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sbar { display: flex; gap: 2px; height: 22px; min-width: 0; }
.sbar > span { min-width: 3px; display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sbar > span:first-child { border-radius: 4px 0 0 4px; } .sbar > span:last-child { border-radius: 0 4px 4px 0; }
.sbar > span:only-child { border-radius: 4px; }
.sbar .yes { background: var(--c-yes); color: var(--c-yes-t); }
.sbar .mid { background: var(--c-mid); color: var(--c-mid-t); }
.sbar .no { background: var(--c-no); color: var(--c-no-t); }
.sbar.none { background: var(--surface-2); border-radius: 4px; }
[data-tip]:hover, [data-tip]:focus-visible { filter: brightness(1.12); }
@container (max-width: 520px) { .srow { grid-template-columns: minmax(0, 1fr) auto; } .srow .sbar { grid-column: 1 / -1; order: 3; } }

.hrows { display: flex; flex-direction: column; gap: 9px; }
.hrow { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 96px; gap: 4px 12px; align-items: center; font-size: 14.5px; }
.hrow .track { height: 12px; min-width: 0; }
.hrow .bar { height: 100%; background: var(--c-yes); border-radius: 0 4px 4px 0; min-width: 2px; }
.hrow .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
.hrow .val small { color: var(--ink-3); margin-left: 6px; }
@container (max-width: 520px) { .hrow { grid-template-columns: minmax(0, 1fr) auto; } .hrow .track { grid-column: 1 / -1; order: 3; } }

.cols { display: flex; align-items: flex-end; gap: 2px; height: 150px; border-bottom: 1px solid var(--line-2); }
.col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.col-val { font-size: 11.5px; color: var(--ink-2); line-height: 18px; font-variant-numeric: tabular-nums; }
.col-bar { width: min(24px, 72%); background: var(--c-yes); border-radius: 4px 4px 0 0; }
.cols-x { display: flex; gap: 2px; }
.cols-x span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; overflow: visible; white-space: nowrap; }

.line { position: relative; height: 170px; margin-left: 26px; border-bottom: 1px solid var(--line-2); }
.line .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.line .gl span { position: absolute; left: -26px; top: -8px; width: 20px; text-align: right; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.line svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.line svg polyline { fill: none; stroke: var(--c-yes); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.line .pt { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; display: grid; place-items: center; }
.line .pt::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-yes); box-shadow: 0 0 0 2px var(--surface); }
.line .end { position: absolute; font-size: 12.5px; font-weight: 700; transform: translate(-50%, -26px); white-space: nowrap; }
.line-x { margin-left: 26px; }

.dumb-axis, .dumb { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr) 118px; gap: 12px; align-items: center; }
.dumb-axis .ticks { position: relative; height: 16px; }
.dumb-axis .ticks span { position: absolute; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dumb { font-size: 14.5px; padding: 5px 0; border-top: 1px solid var(--line); }
.dumb.weak { color: var(--ink-3); }
.dumb .trk { position: relative; height: 24px; }
.dumb .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 11.5px; border-top: 1px solid var(--line); }
.dumb .join { position: absolute; top: 11px; height: 2px; background: var(--line-2); }
.dumb .dot { position: absolute; top: 0; width: 24px; height: 24px; margin-left: -12px; display: grid; place-items: center; }
.dumb .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.dumb .dot.y::after { background: var(--c-yes); } .dumb .dot.n::after { background: var(--c-no); }
.dumb .gap { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.dumb .gap small { display: block; color: var(--ink-3); font-size: 12px; }
@container (max-width: 560px) { .dumb-axis, .dumb { grid-template-columns: minmax(0, 1fr) auto; } .dumb .trk, .dumb-axis .ticks { grid-column: 1 / -1; order: 3; } .dumb-axis > :first-child, .dumb-axis > :last-child { display: none; } }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--accent); }

  const fsel = (id, label, cur, opts, on) => h('label', null, label, h('select', { id, onchange: e => { on(e.target.value); renderAdmin(); } }, opts.map(([v, l]) => h('option', { value: v, selected: v === cur }, l))));
  const stamp = new Date().toISOString().slice(0, 10);
  const body = { synthese: tabSynthese, accueil: tabAccueil, apprentissage: tabApprentissage, croisees: tabCroisees, verbatims: tabVerbatims, reponses: r => tabReponses(r, demo) }[adm.tab](rs);
  app.replaceChildren(h('div', { class: 'board' },
    h('div', { class: 'board-head' },
      h('div', null, h('p', { class: 'eyebrow' }, 'Espace cadre · Service d’hépato-gastro-entérologie'), h('h1', null, 'Résultats du questionnaire')),
      h('div', { class: 'board-tools' },
        store.mode === 'rest' ? h('button', { class: 'btn small', type: 'button', onclick: () => refreshRest(false) }, 'Actualiser') : null,
        (store.mode === 'rest' || store.downloads) && rs.length && !demo ? [h('button', { class: 'btn small', type: 'button', onclick: () => saveFile('questionnaire-fin-de-stage-' + stamp + '.csv', toCSV(rs), 'text/csv;charset=utf-8') }, 'Exporter en CSV'),
          h('button', { class: 'btn small', type: 'button', onclick: () => saveFile('questionnaire-fin-de-stage-' + stamp + '.json', JSON.stringify(rs, null, 2), 'application/json') }, 'Exporter en JSON')] : null,
        store.mode === 'rest' ? [h('button', { class: 'btn small', type: 'button', onclick: () => window.print() }, 'Imprimer'), h('button', { class: 'btn small', type: 'button', onclick: async () => { try { await api('api/logout', { method: 'POST' }); } catch {} store.token = null; ss.del('fds-token'); responses = null; route(); } }, 'Se déconnecter')] : null)),
    demo ? h('div', { class: 'banner' }, h('span', null, h('b', null, 'Données d’exemple. '), 'Aucune réponse n’a encore été enregistrée : ces 48 réponses fictives montrent le tableau de bord. Elles ne sont pas stockées et disparaissent dès la première vraie réponse.'), h('button', { class: 'btn small', type: 'button', onclick: () => { adm.demo = false; renderAdmin(); } }, 'Masquer les exemples'))
      : (!rows.length ? h('div', { class: 'banner' }, h('span', null, h('b', null, 'Aucune réponse pour le moment. '), 'Les résultats apparaîtront ici dès le premier questionnaire envoyé.'), h('button', { class: 'btn small', type: 'button', onclick: () => { adm.demo = true; renderAdmin(); } }, 'Voir avec des exemples')) : null),
    h('div', { class: 'filters' },
      fsel('f-period', 'Période', f.period, [['all', 'Toute la période'], ['3', '3 derniers mois'], ['6', '6 derniers mois'], ['12', '12 derniers mois'], ['year', 'Année en cours'], ['custom', 'Personnalisée']], v => { f.period = v; if (v === 'custom') { f.from = f.from || months[0] || ''; f.to = f.to || months[months.length - 1] || ''; } }),
      f.period === 'custom' ? [fsel('f-from', 'Du', f.from, months.map(m => [m, monthLabel(m, true)]), v => { f.from = v; if (f.to < v) f.to = v; }), fsel('f-to', 'Au', f.to, months.map(m => [m, monthLabel(m, true)]), v => { f.to = v; if (f.from > v) f.from = v; })] : null,
      fsel('f-formation', 'Formation', f.formation, [['', 'Toutes'], ...uniq('formation').map(v => [v, v])], v => { f.formation = v; }),
      fsel('f-annee', 'Année d’étude', f.annee, [['', 'Toutes'], ...uniq('annee').map(v => [v, v])], v => { f.annee = v; }),
      h('span', { class: 'count' }, plural(rs.length, 'réponse') + (rs.length !== rows.length ? ' sur ' + rows.length : ''))),
    h('div', { class: 'tabs', role: 'tablist' }, TABS.map(([id, label]) => h('button', { type: 'button', role: 'tab', id: 'tab-' + id, 'aria-selected': String(adm.tab === id), onclick: () => { adm.tab = id; renderAdmin(); } }, label))),
    body));
  if (keep) { const el = document.getElementById(keep); if (el) el.focus({ preventScroll: true }); }
  window.scrollTo(0, y);
}
function showLogin(msg) {
  app.replaceChildren(h('form', { class: 'login', onsubmit: async e => {
    e.preventDefault(); const btn = $('button', e.target); btn.disabled = true;
    try { const r = await api('api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) }); store.token = r.token; ss.set('fds-token', r.token); route(); }
    catch (err) { btn.disabled = false; $('#login-err').textContent = err.status === 401 ? 'Mot de passe incorrect.' : err.message; }
  } },
    h('p', { class: 'eyebrow' }, 'Espace cadre'), h('h1', null, 'Résultats du questionnaire'),
    h('label', { class: 'field-label', for: 'pw' }, 'Mot de passe'),
    h('input', { class: 'field', type: 'password', id: 'pw', autocomplete: 'current-password', required: true }),
    h('p', { class: 'q-err', id: 'login-err', role: 'alert' }, msg || ''),
    h('button', { class: 'btn primary', type: 'submit' }, 'Se connecter'),
    h('a', { href: '#questionnaire', class: 'sub' }, 'Retour au questionnaire')));
  $('#pw').focus();
}

/* ================= routing ================= */
let currentView = null;
const wantsAdmin = () => location.hash === '#resultats' || location.hash === '#admin' || (!location.hash && /\/admin\/?$/.test(location.pathname));
function route() {
  const admin = wantsAdmin();
  $('#nav').hidden = !(store.isAdmin || (store.mode === 'rest' && store.token));
  $('#nav-form').setAttribute('aria-current', admin ? 'false' : 'page');
  $('#nav-admin').setAttribute('aria-current', admin ? 'page' : 'false');
  if (!admin) { if (currentView !== 'form') { currentView = 'form'; showForm(); } else applyBackendToForm(); return; }
  currentView = 'admin'; $('#progress').hidden = true;
  if (store.mode === 'pending') { app.replaceChildren(h('div', { class: 'board' }, h('p', { class: 'empty' }, 'Chargement des résultats…'))); return; }
  if (store.mode === 'rest') { if (!store.token) { currentView = 'login'; return showLogin(); } renderAdmin(); if (responses == null) startAdminFeed(); return; }
  if (store.mode === 'claude' && store.isAdmin) { renderAdmin(); startAdminFeed(); return; }
  currentView = 'denied';
  app.replaceChildren(h('div', { class: 'sheet' }, h('p', { class: 'notice' }, store.error || 'Les résultats sont réservés au propriétaire et aux éditeurs de cette page.'), h('a', { class: 'btn', href: '#questionnaire' }, 'Aller au questionnaire')));
}
window.addEventListener('hashchange', route);
route();
ready.then(route);

/* ================= tooltip ================= */
const tip = $('#tip');
function showTip(el, x, y) {
  const d = el._tip; if (!d) return;
  tip.replaceChildren(...[h('b', null, d.v), h('span', null, d.t), d.s ? h('span', { style: 'display:block;opacity:.75' }, d.s) : null].filter(Boolean));
  tip.hidden = false;
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = (y - hh - 14 < 8 ? y + 18 : y - hh - 14) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => { tip.hidden = true; });
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
})();
</script>
</body>
